name: Update Manifests

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [release-update]

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Scoop
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm get.scoop.sh -outfile "$env:TEMP\install.ps1"
          & "$env:TEMP\install.ps1" -RunAsAdmin
        shell: powershell

      - name: Update manifests
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install git
          scoop config SCOOP_REPO 'https://github.com/ScoopInstaller/Scoop'
          scoop update

          # Check and update all manifests
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          & $checkver -Dir ./bucket -Update
        shell: powershell

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bucket/*.json
          git diff --staged --quiet || git commit -m "Auto-update manifests"

          # GitHub disables scheduled workflows after 60 days without repository activity,
          # and a disabled workflow also ignores repository_dispatch.
          # Add an empty commit after 50 quiet days so the repository keeps recent activity.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git commit --allow-empty -m "Keep scheduled workflow enabled"
          fi
          git push
        shell: bash
