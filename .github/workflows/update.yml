name: Update Manifests

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Scoop
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm get.scoop.sh -outfile "$env:TEMP\install.ps1"
          & "$env:TEMP\install.ps1" -RunAsAdmin
        shell: powershell

      - name: Update manifests
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install git
          scoop config SCOOP_REPO 'https://github.com/ScoopInstaller/Scoop'
          scoop update

          # Check and update all manifests
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          & $checkver -Dir . -Update
        shell: powershell

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.json
          git diff --staged --quiet || git commit -m "Auto-update manifests"
          git push
        shell: bash
